                 '&timestamp=0&loop=0&autoplay=0&music_info=0&description=0&rel=0&native_context_menu=0&closed_caption=0';

  // Solo se cargan los videos del diseño visible (escritorio o celular), así no se duplican
  const mobile = matchMedia('(max-width:820px), (max-aspect-ratio:6/5)');
  function load(){
    const scope = document.querySelector(mobile.matches ? '.wrap-mob' : '.wrap-desk');
    const other = document.querySelector(mobile.matches ? '.wrap-desk' : '.wrap-mob');
    other.querySelectorAll('.video').forEach(v => v.innerHTML = '');
    scope.querySelectorAll('.video').forEach(v => {
      if (v.firstChild) return;
      const f = document.createElement('iframe');
      f.src = `https://www.tiktok.com/player/v1/${v.dataset.id}?${PARAMS}`;
      f.title = `Video inspiración ${v.dataset.title}`;
      f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
      f.allowFullscreen = true;
      f.loading = 'lazy';
      v.appendChild(f);
    });
  }
  load();
  mobile.addEventListener('change', load);

  document.querySelectorAll('.back').forEach(a => {
    if (BACK_URL) { a.href = BACK_URL; a.target = '_top'; }
    else a.addEventListener('click', e => { e.preventDefault(); history.back(); });
  });
</script>
</body>
</html>
