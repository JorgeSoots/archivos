<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frecuencia Retro – Countdown</title>
<style>

:root { --bg:#160a45; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family: "Arial Black", Arial, Helvetica, sans-serif; }

  /* Escenario 16:9 que escala a la ventana */
  .stage {
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16 / 9;
    background:url("https://archivos-self.vercel.app/Site-FFA-V2_Vista%201.jpg")center / 100% 100% no-repeat;
    container-type:inline-size;
    overflow:hidden;
  }
  /* 1cqw = ancho/100  → 1px del diseño original (1600px) = 0.0625cqw */

  .counter { position:absolute; inset:0; pointer-events:none; }
  .col { position:absolute; }

  .label {
    position:absolute; top:calc(590/16*1cqw); height:calc(37/16*1cqw);
    background:#5c0b0b;
    color:#fff; font-weight:900; font-size:calc(27/16*1cqw); letter-spacing:.02em;
    display:flex; align-items:center; justify-content:center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .box {
    position:absolute; top:calc(629/16*1cqw); height:calc(106/16*1cqw);
    background:linear-gradient(180deg,#3d3d3d 0%,#262626 45%,#1c1c1c 100%);
    border-radius:calc(3/16*1cqw);
    box-shadow:0 calc(3/16*1cqw) calc(8/16*1cqw) rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; gap:calc(8/16*1cqw);
  }
  .digit { height:calc(72/16*1cqw); width:auto; overflow:visible; }
  .digit polygon { fill:#3b0c0c; transition:fill .15s; }
  .digit polygon.on { fill:#ff1f1f; filter:drop-shadow(0 0 calc(2/16*1cqw) rgba(255,30,30,.85)); }

  .footer {
    position:absolute; left:calc(564/16*1cqw); top:calc(738/16*1cqw);
    width:calc(472/16*1cqw); height:calc(37/16*1cqw);
    background:#000; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family: Arial, Helvetica, sans-serif; font-weight:900;
    font-size:calc(28/16*1cqw); letter-spacing:.01em;
  }
  .footer.party { animation:pulse 1s ease-in-out infinite; color:#ffe14d; }
  @keyframes pulse { 50% { color:#ff4fd8; } }
</style>
</head>
<body>
<div class="stage" id="stage" title="Doble clic para pantalla completa">
  <div class="counter" id="counter"></div>
  <div class="footer" id="footer">TIEMPO PARA LA FIESTA</div>
</div>

<script>
  // Fecha objetivo: 10 de diciembre de 2026, 2:00 pm (hora de Ciudad de México, UTC-6)
  const TARGET = new Date('2026-12-10T14:00:00-06:00').getTime();

  // Posiciones (px del diseño original 1600x900)
  const COLS = [
    { key:'d', label:'DÍAS', x:564 },
    { key:'h', label:'HORA', x:685 },
    { key:'m', label:'MIN',  x:807 },
    { key:'s', label:'SEG',  x:928 },
  ];
  const COL_W = 108;
  const u = px => `calc(${px}/16*1cqw)`;

  // Display de 7 segmentos (viewBox 40x72)
  const H = (x1,x2,y) => `${x1},${y} ${x1+3},${y-3} ${x2-3},${y-3} ${x2},${y} ${x2-3},${y+3} ${x1+3},${y+3}`;
  const V = (x,y1,y2) => `${x},${y1} ${x+3},${y1+3} ${x+3},${y2-3} ${x},${y2} ${x-3},${y2-3} ${x-3},${y1+3}`;
  const SEG = { a:H(6,34,4), b:V(36,6,34), c:V(36,38,66), d:H(6,34,68), e:V(4,38,66), f:V(4,6,34), g:H(6,34,36) };
  const MAP = ['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];

  function makeDigit() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 40 72');
    svg.setAttribute('class','digit');
    svg.segs = {};
    for (const k in SEG) {
      const p = document.createElementNS(ns,'polygon');
      p.setAttribute('points', SEG[k]);
      svg.appendChild(p); svg.segs[k] = p;
    }
    svg.set = n => { const on = MAP[n]; for (const k in svg.segs) svg.segs[k].classList.toggle('on', on.includes(k)); };
    return svg;
  }

  const counter = document.getElementById('counter');
  const boxes = {};
  COLS.forEach(c => {
    const lab = document.createElement('div');
    lab.className = 'label'; lab.textContent = c.label;
    lab.style.left = u(c.x); lab.style.width = u(COL_W);
    const box = document.createElement('div');
    box.className = 'box'; box.style.left = u(c.x); box.style.width = u(COL_W);
    counter.append(lab, box);
    boxes[c.key] = { el: box, digits: [] };
  });

  function setValue(key, val) {
    const b = boxes[key];
    const str = String(val).padStart(2,'0');
    while (b.digits.length < str.length) { const d = makeDigit(); b.el.appendChild(d); b.digits.push(d); }
    while (b.digits.length > str.length) b.el.removeChild(b.digits.pop());
    [...str].forEach((ch,i) => b.digits[i].set(+ch));
  }

  const footer = document.getElementById('footer');
  function tick() {
    let diff = Math.max(0, TARGET - Date.now());
    const total = Math.floor(diff / 1000);
    setValue('d', Math.floor(total / 86400));
    setValue('h', Math.floor(total % 86400 / 3600));
    setValue('m', Math.floor(total % 3600 / 60));
    setValue('s', total % 60);
    if (diff === 0) { footer.textContent = '¡ES HORA DE LA FIESTA!'; footer.classList.add('party'); return; }
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();

  // Doble clic = pantalla completa (útil para proyectar en pantallas del evento)
  document.getElementById('stage').addEventListener('dblclick', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
</script>
</body>
</html>
