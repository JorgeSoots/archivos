<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frecuencia Retro – Countdown</title>
<style>

:root {
  --bg:#160a45;
  /* ====== Relación de aspecto y fondo: escritorio por defecto ====== */
  --ratio-w:16; --ratio-h:9;
  --bg-img: url("https://archivos-self.vercel.app/Site-FFA-V2_Vista%201.jpg");

  /* Posiciones en cqw (1cqw = 1% del ancho del escenario) */
  --col0:35.25; --col1:42.8125; --col2:50.4375; --col3:58; --col-w:6.75;
  --label-top:36.875; --label-h:2.3125; --label-font:1.6875;
  --box-top:39.3125; --box-h:6.625; --box-radius:.1875; --digit-h:4.5; --digit-gap:.5;
  --footer-left:35.25; --footer-top:46.125; --footer-w:29.5; --footer-h:2.3125; --footer-font:1.75;
}

/* ====== Mismos elementos, pero reubicados para el fondo vertical de móvil ====== */
@media (max-width:760px){
  :root{
    --ratio-w:500; --ratio-h:894;
    --bg-img: url("https://archivos-self.vercel.app/Site-FFA-Vista%201-Celular.jpg");

    --col0:5.5; --col1:28.5; --col2:51.5; --col3:74.5; --col-w:20;
    --label-top:112.6; --label-h:4; --label-font:3;
    --box-top:117.2; --box-h:14.6; --box-radius:.4; --digit-h:10; --digit-gap:1.4;
    --footer-left:5.5; --footer-top:108; --footer-w:89; --footer-h:4; --footer-font:2.8;
  }
}

  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family: "Arial Black", Arial, Helvetica, sans-serif; }

  /* Escenario que escala a la ventana, con la relación de aspecto activa (ver :root arriba) */
  .stage {
    position:relative;
    width:min(100vw, calc(100vh * var(--ratio-w) / var(--ratio-h)));
    aspect-ratio: var(--ratio-w) / var(--ratio-h);
    background:var(--bg-img) center / 100% 100% no-repeat;
    container-type:inline-size;
    overflow:hidden;
  }
  /* Todas las medidas de abajo están en cqw (1cqw = 1% del ancho del escenario);
     como la relación de aspecto del escenario siempre coincide con el fondo activo,
     1cqw representa la misma fracción del diseño tanto en horizontal como en vertical. */

  .counter { position:absolute; inset:0; pointer-events:none; }
  .col { position:absolute; }

  .label {
    position:absolute; top:calc(var(--label-top)*1cqw); height:calc(var(--label-h)*1cqw);
    width:calc(var(--col-w)*1cqw);
    background:#5c0b0b;
    color:#fff; font-weight:900; font-size:calc(var(--label-font)*1cqw); letter-spacing:.02em;
    display:flex; align-items:center; justify-content:center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .box {
    position:absolute; top:calc(var(--box-top)*1cqw); height:calc(var(--box-h)*1cqw);
    width:calc(var(--col-w)*1cqw);
    background:linear-gradient(180deg,#3d3d3d 0%,#262626 45%,#1c1c1c 100%);
    border-radius:calc(var(--box-radius)*1cqw);
    box-shadow:0 calc(.1875*1cqw) calc(.5*1cqw) rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; gap:calc(var(--digit-gap)*1cqw);
  }
  .digit { height:calc(var(--digit-h)*1cqw); width:auto; overflow:visible; }
  .digit polygon { fill:#3b0c0c; transition:fill .15s; }
  .digit polygon.on { fill:#ff1f1f; filter:drop-shadow(0 0 calc(.125*1cqw) rgba(255,30,30,.85)); }

  .footer {
    position:absolute; left:calc(var(--footer-left)*1cqw); top:calc(var(--footer-top)*1cqw);
    width:calc(var(--footer-w)*1cqw); height:calc(var(--footer-h)*1cqw);
    background:#000; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family: Arial, Helvetica, sans-serif; font-weight:900;
    font-size:calc(var(--footer-font)*1cqw); letter-spacing:.01em;
  }
  .footer.party { animation:pulse 1s ease-in-out infinite; color:#ffe14d; }
  @keyframes pulse { 50% { color:#ff4fd8; } }
</style>
</head>
<body>
<div class="stage" id="stage" title="Doble clic para pantalla completa">
  <div class="counter" id="counter"></div>
  <div class="footer" id="footer">TIEMPO PARA LA FIESTA</div>
</div>

<script>
  // Fecha objetivo: 10 de diciembre de 2026, 2:00 pm (hora de Ciudad de México, UTC-6)
  const TARGET = new Date('2026-12-10T14:00:00-06:00').getTime();

  // Posiciones (columnas: variables CSS --col0.. --col3, ver :root)
  const COLS = [
    { key:'d', label:'DÍAS', varx:'--col0' },
    { key:'h', label:'HORA', varx:'--col1' },
    { key:'m', label:'MIN',  varx:'--col2' },
    { key:'s', label:'SEG',  varx:'--col3' },
  ];
  const cv = name => `calc(var(${name}) * 1cqw)`;

  // Display de 7 segmentos (viewBox 40x72)
  const H = (x1,x2,y) => `${x1},${y} ${x1+3},${y-3} ${x2-3},${y-3} ${x2},${y} ${x2-3},${y+3} ${x1+3},${y+3}`;
  const V = (x,y1,y2) => `${x},${y1} ${x+3},${y1+3} ${x+3},${y2-3} ${x},${y2} ${x-3},${y2-3} ${x-3},${y1+3}`;
  const SEG = { a:H(6,34,4), b:V(36,6,34), c:V(36,38,66), d:H(6,34,68), e:V(4,38,66), f:V(4,6,34), g:H(6,34,36) };
  const MAP = ['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];

  function makeDigit() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 40 72');
    svg.setAttribute('class','digit');
    svg.segs = {};
    for (const k in SEG) {
      const p = document.createElementNS(ns,'polygon');
      p.setAttribute('points', SEG[k]);
      svg.appendChild(p); svg.segs[k] = p;
    }
    svg.set = n => { const on = MAP[n]; for (const k in svg.segs) svg.segs[k].classList.toggle('on', on.includes(k)); };
    return svg;
  }

  const counter = document.getElementById('counter');
  const boxes = {};
  COLS.forEach(c => {
    const lab = document.createElement('div');
    lab.className = 'label'; lab.textContent = c.label;
    lab.style.left = cv(c.varx);
    const box = document.createElement('div');
    box.className = 'box'; box.style.left = cv(c.varx);
    counter.append(lab, box);
    boxes[c.key] = { el: box, digits: [] };
  });

  function setValue(key, val) {
    const b = boxes[key];
    const str = String(val).padStart(2,'0');
    while (b.digits.length < str.length) { const d = makeDigit(); b.el.appendChild(d); b.digits.push(d); }
    while (b.digits.length > str.length) b.el.removeChild(b.digits.pop());
    [...str].forEach((ch,i) => b.digits[i].set(+ch));
  }

  const footer = document.getElementById('footer');
  function tick() {
    let diff = Math.max(0, TARGET - Date.now());
    const total = Math.floor(diff / 1000);
    setValue('d', Math.floor(total / 86400));
    setValue('h', Math.floor(total % 86400 / 3600));
    setValue('m', Math.floor(total % 3600 / 60));
    setValue('s', total % 60);
    if (diff === 0) { footer.textContent = '¡ES HORA DE LA FIESTA!'; footer.classList.add('party'); return; }
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();

  // Doble clic = pantalla completa (útil para proyectar en pantallas del evento)
  document.getElementById('stage').addEventListener('dblclick', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
</script>
</body>
</html>
