<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frecuencia Retro – Countdown</title>
<style>

:root {
  --bg:#160a45;

  /* ====== Escritorio (bloque ~16:9, el fondo ya tiene esa misma proporción) ====== */
  --bg-img: url("https://archivos-self.vercel.app/Site-FFA-V2_Vista%201.jpg");
  --bg-pos: center center;

  /* Posiciones en vw (ancho) / vh (alto) del bloque donde vive esta página */
  --col0:35.25; --col1:42.8125; --col2:50.4375; --col3:58; --col-w:6.75; --digit-gap:.5;
  --label-top:65.5556; --label-h:4.1111; --label-font:3;
  --box-top:69.8889; --box-h:11.7778; --box-radius:.3333; --digit-h:8;
  --footer-left:35.25; --footer-top:82; --footer-w:29.5; --footer-h:4.1111; --footer-font:3.1111;
}

/* ====== Celular: el bloque de Eventtia sigue siendo ancho y corto (no se vuelve
   vertical), así que en vez de estirar la imagen vertical completa (lo que la
   aplastaba) la recortamos mostrando la franja donde está "Frecuencia Retro" y
   el contador, que es lo importante. ====== */
@media (max-width:760px){
  :root{
    --bg-img: url("https://archivos-self.vercel.app/Site-FFA-Vista%201-Celular.jpg");
    --bg-pos: center 60.3%;

    --col0:5.350; --col1:27.724; --col2:50.097; --col3:72.471; --col-w:19.455; --digit-gap:1.362;
    --label-top:63.239; --label-h:6.911; --label-font:5.184;
    --box-top:71.187; --box-h:25.227; --box-radius:.691; --digit-h:17.278;
    --footer-left:5.350; --footer-top:55.291; --footer-w:86.576; --footer-h:6.911; --footer-font:4.838;
  }
}

  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); overflow:hidden; }
  body { font-family: "Arial Black", Arial, Helvetica, sans-serif; }

  /* El escenario ocupa siempre el 100% del espacio real que da el bloque que lo
     contiene (sea cual sea su forma), y el fondo se ajusta con "cover" para que
     nunca queden franjas ni se vea estirado/aplastado. */
  .stage {
    position:relative;
    width:100%; height:100%;
    background:var(--bg-img) var(--bg-pos) / cover no-repeat;
    overflow:hidden;
  }

  .counter { position:absolute; inset:0; pointer-events:none; }
  .col { position:absolute; }

  .label {
    position:absolute; top:calc(var(--label-top)*1vh); height:calc(var(--label-h)*1vh);
    width:calc(var(--col-w)*1vw);
    background:#5c0b0b;
    color:#fff; font-weight:900; font-size:calc(var(--label-font)*1vh); letter-spacing:.02em;
    display:flex; align-items:center; justify-content:center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .box {
    position:absolute; top:calc(var(--box-top)*1vh); height:calc(var(--box-h)*1vh);
    width:calc(var(--col-w)*1vw);
    background:linear-gradient(180deg,#3d3d3d 0%,#262626 45%,#1c1c1c 100%);
    border-radius:calc(var(--box-radius)*1vh);
    box-shadow:0 .3vh .6vh rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; gap:calc(var(--digit-gap)*1vw);
  }
  .digit { height:calc(var(--digit-h)*1vh); width:auto; overflow:visible; }
  .digit polygon { fill:#3b0c0c; transition:fill .15s; }
  .digit polygon.on { fill:#ff1f1f; filter:drop-shadow(0 0 .2vh rgba(255,30,30,.85)); }

  .footer {
    position:absolute; left:calc(var(--footer-left)*1vw); top:calc(var(--footer-top)*1vh);
    width:calc(var(--footer-w)*1vw); height:calc(var(--footer-h)*1vh);
    background:#000; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family: Arial, Helvetica, sans-serif; font-weight:900;
    font-size:calc(var(--footer-font)*1vh); letter-spacing:.01em;
  }
  .footer.party { animation:pulse 1s ease-in-out infinite; color:#ffe14d; }
  @keyframes pulse { 50% { color:#ff4fd8; } }
</style>
</head>
<body>
<div class="stage" id="stage" title="Doble clic para pantalla completa">
  <div class="counter" id="counter"></div>
  <div class="footer" id="footer">TIEMPO PARA LA FIESTA</div>
</div>

<script>
  // Fecha objetivo: 10 de diciembre de 2026, 2:00 pm (hora de Ciudad de México, UTC-6)
  const TARGET = new Date('2026-12-10T14:00:00-06:00').getTime();

  // Posiciones (columnas: variables CSS --col0.. --col3, ver :root)
  const COLS = [
    { key:'d', label:'DÍAS', varx:'--col0' },
    { key:'h', label:'HORA', varx:'--col1' },
    { key:'m', label:'MIN',  varx:'--col2' },
    { key:'s', label:'SEG',  varx:'--col3' },
  ];
  const cv = name => `calc(var(${name}) * 1vw)`;

  // Display de 7 segmentos (viewBox 40x72)
  const H = (x1,x2,y) => `${x1},${y} ${x1+3},${y-3} ${x2-3},${y-3} ${x2},${y} ${x2-3},${y+3} ${x1+3},${y+3}`;
  const V = (x,y1,y2) => `${x},${y1} ${x+3},${y1+3} ${x+3},${y2-3} ${x},${y2} ${x-3},${y2-3} ${x-3},${y1+3}`;
  const SEG = { a:H(6,34,4), b:V(36,6,34), c:V(36,38,66), d:H(6,34,68), e:V(4,38,66), f:V(4,6,34), g:H(6,34,36) };
  const MAP = ['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];

  function makeDigit() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 40 72');
    svg.setAttribute('class','digit');
    svg.segs = {};
    for (const k in SEG) {
      const p = document.createElementNS(ns,'polygon');
      p.setAttribute('points', SEG[k]);
      svg.appendChild(p); svg.segs[k] = p;
    }
    svg.set = n => { const on = MAP[n]; for (const k in svg.segs) svg.segs[k].classList.toggle('on', on.includes(k)); };
    return svg;
  }

  const counter = document.getElementById('counter');
  const boxes = {};
  COLS.forEach(c => {
    const lab = document.createElement('div');
    lab.className = 'label'; lab.textContent = c.label;
    lab.style.left = cv(c.varx);
    const box = document.createElement('div');
    box.className = 'box'; box.style.left = cv(c.varx);
    counter.append(lab, box);
    boxes[c.key] = { el: box, digits: [] };
  });

  function setValue(key, val) {
    const b = boxes[key];
    const str = String(val).padStart(2,'0');
    while (b.digits.length < str.length) { const d = makeDigit(); b.el.appendChild(d); b.digits.push(d); }
    while (b.digits.length > str.length) b.el.removeChild(b.digits.pop());
    [...str].forEach((ch,i) => b.digits[i].set(+ch));
  }

  const footer = document.getElementById('footer');
  function tick() {
    let diff = Math.max(0, TARGET - Date.now());
    const total = Math.floor(diff / 1000);
    setValue('d', Math.floor(total / 86400));
    setValue('h', Math.floor(total % 86400 / 3600));
    setValue('m', Math.floor(total % 3600 / 60));
    setValue('s', total % 60);
    if (diff === 0) { footer.textContent = '¡ES HORA DE LA FIESTA!'; footer.classList.add('party'); return; }
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();

  // Doble clic = pantalla completa (útil para proyectar en pantallas del evento)
  document.getElementById('stage').addEventListener('dblclick', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
</script>
</body>
</html>
