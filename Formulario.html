<style>
  /* ====== Paleta tomada del diseño ====== */
  :root{
    --gris:#bbbbbb;      /* cromo de la ventana */
    --gris-claro:#dfdfdf;
    --sombra:#808080;
    --negro:#000000;
    --blanco:#ffffff;
    --azul-titulo:#000080;
    --oro:#ccb030;       /* letras REGISTRO */
    --verde:#509854;     /* "Saca tu atuendo más retro" */
    --ui: Tahoma, "Segoe UI", Arial, Helvetica, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--gris);font-family:var(--ui);color:#000;overflow:hidden}

  /* Relieves estilo Windows 98 */
  .raised{border:2px solid;border-color:var(--blanco) var(--negro) var(--negro) var(--blanco);box-shadow:inset -1px -1px 0 var(--sombra),inset 1px 1px 0 var(--gris-claro)}
  .sunken{border:2px solid;border-color:var(--sombra) var(--blanco) var(--blanco) var(--sombra);box-shadow:inset 1px 1px 0 var(--negro)}

  .window{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--gris)}

  /* ====== Barra de título ====== */
  .titlebar{background:var(--azul-titulo);color:#fff;display:flex;align-items:center;gap:12px;
    padding:6px 8px 6px 12px;min-height:44px;user-select:none}
  .titlebar img{width:28px;height:28px;flex:none;image-rendering:auto}
  .titlebar h1{font:400 20px/1.2 var(--ui);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .controls{display:flex;gap:4px;flex:none}
  .controls span{width:34px;height:30px;background:var(--gris);display:grid;place-items:center}
  .controls svg{width:16px;height:16px}

  /* ====== Menú ====== */
  .menubar{display:flex;flex-wrap:wrap;gap:6px 44px;padding:12px 24px 12px 52px;font-size:20px}
  .menubar a{color:#000;text-decoration:none;cursor:pointer;padding:2px 4px}
  .menubar a u{text-underline-offset:3px}
  .menubar a:hover,.menubar a:focus-visible{background:var(--azul-titulo);color:#fff;outline:none}
  .menubar a.off{cursor:default;opacity:.55}
  .menubar a.off:hover{background:none;color:#000}

  /* ====== Barra de dirección ====== */
  .addressbar{display:flex;align-items:stretch;gap:12px;padding:6px 6px 10px;border-top:2px solid var(--sombra);
    box-shadow:inset 0 1px 0 var(--blanco)}
  .addressbar label{display:flex;align-items:center;padding:0 12px 0 46px;font-size:20px}
  .addressbar .field{flex:1;background:#fff;display:flex;align-items:center;padding:0 12px;font-size:16px;
    min-height:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#333}
  .btn{background:var(--gris);font:400 20px var(--ui);padding:0 28px;min-height:52px;cursor:pointer;color:#000}
  .btn:active{border-color:var(--negro) var(--blanco) var(--blanco) var(--negro);box-shadow:inset 1px 1px 0 var(--sombra)}

  /* ====== Área de contenido ====== */
  .content{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;
    border-top:8px solid var(--negro);border-left:14px solid var(--negro);margin-right:8px}
  .header{display:flex;align-items:flex-start;gap:36px;padding:14px 32px 14px 34px;border-bottom:8px solid var(--sombra)}
  .tagline{font-size:20px;line-height:1.4;padding-top:6px}
  .tagline em{font-style:normal;color:var(--verde)}

  /* WordArt "REGISTRO" */
  .wordart{display:flex;align-items:flex-start;font-family:"Arial Black","Arial Bold",Gadget,Arial,sans-serif;font-weight:900;
    color:var(--oro);line-height:1;letter-spacing:-1px;flex:none;height:96px;--u:1px}
  .wordart span{display:inline-block;text-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 #000}
  .wordart .l1{font-size:calc(66*var(--u));transform:translateY(calc(4*var(--u)))}
  .wordart .l2{font-size:calc(52*var(--u));transform:translateY(calc(26*var(--u)))}
  .wordart .l3{font-size:calc(58*var(--u));transform:translateY(calc(30*var(--u)))}
  .wordart .l4{font-size:calc(70*var(--u));transform:translateY(calc(-2*var(--u)))}
  .wordart .l5{font-size:calc(56*var(--u));transform:translateY(calc(20*var(--u)))}
  .wordart .l6{font-size:calc(52*var(--u));transform:translateY(calc(30*var(--u)))}
  .wordart .l7{font-size:calc(66*var(--u));transform:translateY(calc(2*var(--u)))}
  .wordart .l8{font-size:calc(68*var(--u));transform:translateY(calc(8*var(--u)))}

  .viewport{flex:1;min-height:0;position:relative}
  .viewport iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}

  /* ====== Barra de estado ====== */
  .statusbar{display:flex;gap:4px;padding:6px 4px;font-size:15px}
  .statusbar div{padding:4px 10px}
  .statusbar .grow{flex:1}

  /* ====== Responsive ====== */
  @media (max-width:900px){
    .titlebar h1{font-size:16px}
    .controls span{width:26px;height:24px}
    .menubar{font-size:17px;gap:4px 22px;padding:10px 14px}
    .addressbar label{display:none}
    .addressbar .field{display:none}
    .btn{flex:1;font-size:17px;min-height:46px}
    .content{border-left-width:6px;border-top-width:6px;margin-right:0}
    .header{flex-direction:column;gap:6px;padding:12px 16px}
    .wordart{--u:.72px;height:72px}
    .tagline{font-size:16px;padding-top:0}
    .statusbar{font-size:13px}
  }
</style>
</head>

<script>
  // URL del formulario de Eventtia (cámbiala aquí si cambia el evento)
  const FORM_URL = 'https://live.eventtia.com/es/frecuencia-retro';

  const frame  = document.getElementById('frame');
  const addr   = document.getElementById('addr');
  const status = document.getElementById('status');

  function openPage(url){
    status.textContent = 'Abriendo página…';
    addr.textContent = url;
    frame.src = url;
  }
  frame.addEventListener('load', () => { status.textContent = 'Listo'; });
  addr.textContent = FORM_URL;

  document.getElementById('go').addEventListener('click', () => openPage(FORM_URL));
  document.querySelectorAll('.menubar a').forEach(a => {
    const url = a.dataset.url;
    if (!url) { a.classList.add('off'); a.title = 'Próximamente'; return; }
    a.href = url; a.tabIndex = 0;
    a.addEventListener('click', e => { e.preventDefault(); openPage(url); });
  });
</script>
