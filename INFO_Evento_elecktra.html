<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Información del evento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: #333;
    }

    /* Marco rosa del diseño de referencia */
    .event-sheet {
      position: relative;
      width: calc(100% - 16px);
      min-height: calc(100vh - 16px);
      min-height: calc(100svh - 16px);
      margin: 8px;
      padding: 34px 4.8% 105px;
      overflow: hidden;
      border: 2px solid #ed2b91;
      border-radius: 10px;
      background: #fff;
      isolation: isolate;
    }

    /* Título azul con extrusión, como en la referencia */
    .event-title {
      margin: 0;
      color: #39baf2;
      font-family: "Fredoka", "Arial Rounded MT Bold", Arial, sans-serif;
      font-size: clamp(36px, 5.1vw, 58px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.035em;
      -webkit-text-stroke: 1px #0750a8;
      paint-order: stroke fill;
      text-shadow:
        0 2px 0 #1444b5,
        0 4px 0 #123aa8,
        0 6px 0 #0c3296,
        0 8px 0 #08277e;
    }

    /* Dos columnas: información a la izquierda y complementos a la derecha */
    .event-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(285px, .96fr);
      gap: clamp(28px, 3.8vw, 44px);
      width: 87%;
      margin-top: 30px;
      align-items: start;
    }

    .event-details {
      min-width: 0;
    }

    .detail-section {
      margin: 0 0 10px;
    }

    .detail-heading {
      margin: 0 0 4px;
      padding: 0 0 2px;
      border-bottom: 1px solid #9bbdf5;
      color: #174eae;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(16px, 1.65vw, 19px);
      font-weight: 700;
      line-height: 1.25;
    }

    .detail-copy {
      margin: 0;
      color: #333;
      font-size: clamp(13px, 1.35vw, 15px);
      line-height: 1.55;
    }

    .placeholder {
      color: #858585;
      font-style: italic;
    }

    .agenda-list {
      margin: 3px 0 0;
      padding-left: 20px;
      color: #888;
      font-size: clamp(13px, 1.35vw, 15px);
      font-style: italic;
      line-height: 1.55;
    }

    .event-side {
      width: 100%;
      min-width: 0;
      padding-top: 8px;
    }

    /*
      CONTENEDOR PREPARADO PARA GOOGLE MAPS.
      Conserva la proporción y dimensiones actuales del recuadro.
      Cuando tengas la ubicación, reemplaza .map-placeholder por un iframe
      de Google Maps. El iframe ocupará automáticamente todo este espacio.
    */
    .map-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1.52 / 1;
      overflow: hidden;
      border: 1px solid #a4a4a4;
      background: #e2eff1;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
    }

    .map-container iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Mapa ilustrativo temporal; se retira al insertar Google Maps. */
    .map-placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(90deg, transparent 0 40%, #fff 40% 43%, transparent 43%),
        linear-gradient(0deg, transparent 0 39%, #fff 39% 44%, transparent 44%),
        repeating-linear-gradient(0deg, transparent 0 24px, rgba(255,255,255,.42) 24px 25px),
        repeating-linear-gradient(90deg, transparent 0 24px, rgba(255,255,255,.42) 24px 25px),
        linear-gradient(115deg, #d7eadf 0%, #e2eff1 100%);
    }

    .map-placeholder::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 41.5%;
      width: 10px;
      background: rgba(255,255,255,.94);
    }

    .map-placeholder::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 59%;
      height: 10px;
      background: rgba(255,255,255,.94);
    }

    .map-pin {
      position: absolute;
      z-index: 2;
      left: 56%;
      top: 29%;
      width: 23px;
      height: 23px;
      border-radius: 50% 50% 50% 0;
      background: #f4325d;
      transform: rotate(-45deg);
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
    }

    .map-pin::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      left: 7.5px;
      top: 7.5px;
      border-radius: 50%;
      background: #f4325d;
    }

    /* La casita funciona como botón, sin navegación ni acción por ahora. */
    .event-house-button {
      position: absolute;
      z-index: 2;
      right: 1.8%;
      bottom: 5.0%;
      display: block;
      width: clamp(135px, 15vw, 170px);
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .2s ease, filter .2s ease;
    }

    .event-house-button:hover {
      transform: translateY(-3px) scale(1.04);
      filter: drop-shadow(0 4px 5px rgba(0,0,0,.12));
    }

    .event-house-button:focus-visible {
      outline: 3px solid #2878db;
      outline-offset: 5px;
      border-radius: 8px;
    }

    .event-house {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .event-sheet {
        min-height: calc(100svh - 16px);
        padding: 28px 6% 145px;
      }

      .event-title {
        max-width: 100%;
        font-size: clamp(32px, 8vw, 46px);
        line-height: 1.12;
      }

      .event-layout {
        width: 100%;
        grid-template-columns: 1fr;
        gap: 22px;
        margin-top: 26px;
      }

      .detail-section {
        margin-bottom: 17px;
      }

      .detail-heading {
        font-size: 17px;
      }

      .detail-copy,
      .agenda-list {
        font-size: 14px;
      }

      .event-side {
        width: min(100%, 420px);
        padding-top: 0;
      }

      .event-house-button {
        right: 2%;
        bottom: 1.5%;
        width: 112px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="event-sheet" aria-label="Información del evento">
    <h1 class="event-title">Información del evento</h1>

    <div class="event-layout">
      <section class="event-details" aria-label="Detalles del evento">

        <section class="detail-section">
          <h2 class="detail-heading">Fecha y hora</h2>
          <p class="detail-copy placeholder">[Día, fecha del evento]<br>[Hora de inicio – fin]</p>
        </section>

        <section class="detail-section">
          <h2 class="detail-heading">Lugar</h2>
          <p class="detail-copy placeholder">[Nombre del lugar]<br>[Dirección completa]</p>
        </section>

        <section class="detail-section">
          <h2 class="detail-heading">Dress code</h2>
          <p class="detail-copy">Atuendo retro: 80s, 90s o 00s.</p>
        </section>

        <section class="detail-section">
          <h2 class="detail-heading">Agenda</h2>
          <ul class="agenda-list">
            <li>[Hora] · Recepción</li>
            <li>[Hora] · Cena</li>
            <li>[Hora] · Show / DJ</li>
            <li>[Hora] · Premiación</li>
          </ul>
        </section>

      </section>

      <aside class="event-side" aria-label="Mapa del evento">
        <div class="map-container">
          <!--
            MAPA LISTO PARA GOOGLE MAPS.
            Por ahora se muestra el mapa ilustrativo de referencia.
            Cuando tengas la ubicación, elimina .map-placeholder y pega aquí
            el iframe que Google Maps genera en Compartir > Insertar un mapa.
            Ejemplo de estructura (sustituye el src por el tuyo):
            <iframe
              title="Ubicación del evento"
              src="PEGA_AQUI_EL_ENLACE_EMBED_DE_GOOGLE_MAPS"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              allowfullscreen
            ></iframe>
          -->
          <div class="map-placeholder" role="img" aria-label="Espacio reservado para el mapa de Google Maps">
            <span class="map-pin" aria-hidden="true"></span>
          </div>
        </div>
      </aside>
    </div>

      class="event-house-button"
      type="button"
      aria-label="Casita decorativa"
      title="Casita"
